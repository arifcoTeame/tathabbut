   # Keeps the free Render instance awake (it sleeps after 15 min idle).
   name: Keep engine awake
   on:
     schedule:
       - cron: "*/14 * * * *"
     workflow_dispatch:
   jobs:
     ping:
       runs-on: ubuntu-latest
       timeout-minutes: 3
       steps:
         - name: Ping Tathabbut API
           run: curl -fsS --max-time 90 --retry 2 https://tathabbut-api.onrender.com/health
